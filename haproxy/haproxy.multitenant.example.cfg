global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend public_http
    bind *:80
    http-request redirect scheme https code 308

frontend public_https
    # Mount a PEM containing the wildcard certificate and private key.
    bind *:443 ssl crt /run/secrets/erp-wildcard.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    acl api_path path_beg /api
    acl health_path path -i /health
    use_backend api_backend if api_path or health_path
    default_backend frontend_backend

backend api_backend
    option httpchk GET /health
    server backend_go backend-go:8084 check

backend frontend_backend
    server admin_frontend admin-frontend:80 check
