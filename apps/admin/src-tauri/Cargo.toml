[package]
name = "codeverta-erp"
version = "2.1.0"
description = "Codeverta Enterprise System desktop application"
authors = ["Codeverta"]
edition = "2021"

[lib]
name = "codeverta_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
